# Only needed to deploy from the command line (npx wrangler deploy).
# The Cloudflare dashboard works too: paste auth.js into a new Worker.
name = "openfieldview-auth"
main = "auth.js"
compatibility_date = "2026-10-01"

[vars]
ALLOWED_ORIGINS = "https://openfieldview.org,http://localhost:5173"
# GITHUB_CLIENT_ID and GITHUB_CLIENT_SECRET: set with
#   npx wrangler secret put GITHUB_CLIENT_ID
#   npx wrangler secret put GITHUB_CLIENT_SECRET
